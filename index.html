<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Country War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@600;800&display=swap">
<style>
/* War room: the whole screen is the map; brass-trimmed ink panels float over it */
:root{
  --ink:#121821; --panel:#1a2230; --panel2:#222d3e; --line:#33435a; --fg:#ece6d6; --muted:#97a3b5;
  --brass:#d4a24a; --brass2:#f2c771; --danger:#e3624f; --ok:#73c27a; --mana:#9a7cff;
  --display:"Noto Serif Georgian",Georgia,serif; --body:"Noto Sans Georgian",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#map.drag{cursor:grabbing}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--brass);background:#2a374b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--brass);color:#1a1408;border-color:var(--brass2)}
.btn.gold:hover:not(:disabled){background:var(--brass2)}
.btn.red{background:#5a2620;border-color:var(--danger)}
.btn.magic{background:#2e2350;border-color:var(--mana)}
.btn.sm{padding:4px 9px;font-size:12px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.war{color:#ffb4a8;border-color:var(--danger);background:#3a1a17}
.tag.peace{color:#bfe8c2;border-color:#3f6f45}
canvas.icn{width:28px;height:28px;flex:none;display:block}
canvas.icn.s{width:18px;height:18px}
/* HUD */
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:stretch;pointer-events:none;flex-wrap:wrap}
#hud>*{pointer-events:auto}
.plate{background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
#who{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px}
#who canvas{border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
#who .nm{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1}
#who .rl{font-size:11px;color:var(--muted)}
#res{display:flex;gap:2px;padding:4px;flex-wrap:wrap}
.r{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:7px}
.r div{display:flex;flex-direction:column}
.r b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.r small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.r small.neg{color:var(--danger)}
#net{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px}
#net .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#net .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#net .dot.off{background:var(--danger)}
/* side panel */
#side{position:absolute;top:84px;right:8px;bottom:8px;width:370px;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{flex:1;background:none;border:0;padding:10px 6px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
#tabs button.on{color:var(--brass2);border-bottom-color:var(--brass)}
#tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:4px;vertical-align:middle}
#pane{flex:1;overflow-y:auto;padding:14px}
#pane h3{font-family:var(--display);font-size:15px;margin:18px 0 8px;color:var(--brass2)}
#pane h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:13.5px}
.item .tx span{font-size:11.5px;color:var(--muted)}
.item .btns{display:flex;flex-direction:column;gap:4px}
.cost{font-size:11.5px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:2px}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost .no{color:var(--danger)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right}
.invite{display:flex;gap:6px}
.invite input{flex:1;font-size:12px}
#collapse{display:none}
/* tile card */
#tile{position:absolute;left:8px;bottom:8px;width:340px;padding:12px 14px;max-height:52%;overflow:auto}
#tile h4{margin:0 26px 2px 0;font-family:var(--display);font-size:15px}
#tile .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#tile .x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:18px;color:var(--muted)}
#place{position:absolute;left:50%;top:84px;transform:translateX(-50%);padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:12px;max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center;z-index:5}
/* overlays */
.overlay{position:absolute;inset:0;background:rgba(8,11,16,.74);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.card h1{font-family:var(--display);font-weight:800;font-size:34px;margin:0;color:var(--brass2)}
.card h2{font-family:var(--display);font-size:20px;margin:0 0 8px}
.card .sub{margin:4px 0 18px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.field input{font-size:15px}
.flagEd{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:start;margin:6px 0 14px}
.flagEd canvas{width:180px;height:120px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.pats{display:flex;flex-wrap:wrap;gap:5px}
.pats button{width:40px;height:28px;padding:0;border:2px solid var(--line);border-radius:4px;background:var(--ink)}
.pats button.on{border-color:var(--brass2)}
.pats canvas{width:36px;height:24px;display:block;box-shadow:none;border-radius:2px}
.cols{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:end}
.cols label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);align-items:center}
.cols input[type=color]{width:42px;height:32px;padding:2px;border-radius:6px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.swatches button.on{border-color:#fff}
.swatches button:disabled{opacity:.18;cursor:not-allowed}
.modal .units{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.modal .units .item input{width:80px}
#toasts{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:40;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.4);font-size:13px;animation:tin .2s ease-out}
.toast.err{border-color:var(--danger);color:#ffd0c8}
.toast.good{border-color:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.msg b{margin-right:4px}
.msg.sys{color:var(--brass2);font-size:12px}
.msg time{color:var(--muted);font-size:10.5px;margin-left:4px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));text-align:center;padding:22px;z-index:30}
#banner h2{font-family:var(--display);margin:0 0 8px}
@media (max-width:760px){
  #side{top:auto;left:8px;right:8px;width:auto;height:46%}
  #side.min{height:44px}
  #collapse{display:block;position:absolute;right:6px;top:4px;z-index:2;background:none;border:0;font-size:18px;color:var(--muted);padding:6px 10px}
  #tabs{padding-right:40px}
  #tile{left:8px;right:8px;width:auto;bottom:calc(46% + 16px);max-height:34%}
  #side.min ~ #tile{bottom:60px}
  .r{padding:2px 5px;gap:4px}
  .r b{font-size:13px}
  #who .nm{font-size:14px}
  .flagEd{grid-template-columns:1fr}
  #place{top:120px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="რუკა"></canvas>
  <div id="hud" hidden>
    <div id="who" class="plate"><canvas id="myFlag" width="42" height="28"></canvas><div><div class="nm" id="myName"></div><div class="rl" id="myRuler"></div></div></div>
    <div id="res" class="plate"></div>
    <div id="net" class="plate" hidden></div>
  </div>
  <div id="side" class="plate" hidden>
    <button id="collapse" aria-label="ჩაკეცვა">▾</button>
    <div id="tabs" role="tablist"></div>
    <div id="pane"></div>
  </div>
  <div id="tile" class="plate" hidden></div>
  <div id="place" class="plate" hidden></div>
  <div id="toasts"></div>
</div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rid=(n=12)=>{const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="";for(let i=0;i<n;i++)s+=a[Math.random()*36|0];return s};
const fmt=n=>{n=Math.floor(n||0);return Math.abs(n)>=100000?(n/1000).toFixed(0)+"k":Math.abs(n)>=10000?(n/1000).toFixed(1)+"k":String(n)};
const fmtR=n=>(n>=0?"+":"")+(Math.abs(n)>=100?Math.round(n):n.toFixed(1));
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000),m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")};
const hhmm=t=>new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
function hash(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){let t=0,a=1,f=1,n=0;for(let o=0;o<5;o++){t+=vnoise(x*f,y*f,s+o*17)*a;n+=a;a*=.5;f*=2}return t/n}

/* ================= world ================= */
const W=150,H=96,TS=16,SEED=20261108;
const WATER=0,SAND=1,GRASS=2,FOREST=3,HILL=4,MOUNTAIN=5,RIVER=6,DESERT=7;
const TNAME=["ზღვა","სანაპირო","მინდორი","ტყე","ბორცვი","მთა","მდინარე","უდაბნო"];
const TER=new Uint8Array(W*H), ELEV=new Float32Array(W*H);
const idx=(x,y)=>y*W+x, tx=i=>i%W, ty=i=>(i/W)|0;
const N4=i=>{const x=tx(i),y=ty(i),r=[];if(x>0)r.push(i-1);if(x<W-1)r.push(i+1);if(y>0)r.push(i-W);if(y<H-1)r.push(i+W);return r};
const RIVER_EDGES=[],RIVER_PATHS=[];
function genWorld(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const nx=x/W-.5,ny=y/H-.5,d=Math.sqrt(nx*nx+ny*ny*1.2)*2;
    ELEV[idx(x,y)]=fbm(x/24,y/24,SEED)*1.2-Math.pow(d,3)*.7+fbm(x/7,y/7,SEED+5)*.08;
  }
  const sorted=Float32Array.from(ELEV).sort(),q=p=>sorted[Math.floor(p*(sorted.length-1))];
  const tW=q(.42),tS=q(.46),tH=q(.84),tM=q(.93);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=idx(x,y),e=ELEV[i],m=fbm(x/20,y/20,SEED+99);let t;
    if(e<tW)t=WATER;else if(e<tS)t=SAND;else if(e>tM)t=MOUNTAIN;else if(e>tH)t=HILL;
    else if(m>.56)t=FOREST;else if(m<.40)t=DESERT;else t=GRASS;
    TER[i]=t;ELEV[i]=(e-tW)/(tM-tW)*.45+.33;
  }
  // rivers run coast to coast: each starts at the sea on one side, crosses the land along the low ground and reaches the sea on the other side
  const ocean=new Uint8Array(W*H),oq=[];
  for(let x=0;x<W;x++)for(const y of [0,H-1]){const i=idx(x,y);if(TER[i]===WATER&&!ocean[i]){ocean[i]=1;oq.push(i)}}
  for(let y=0;y<H;y++)for(const x of [0,W-1]){const i=idx(x,y);if(TER[i]===WATER&&!ocean[i]){ocean[i]=1;oq.push(i)}}
  for(let h=0;h<oq.length;h++)for(const n of N4(oq[h]))if(TER[n]===WATER&&!ocean[n]){ocean[n]=1;oq.push(n)}
  const coast=[];for(let i=0;i<W*H;i++)if(TER[i]!==WATER&&N4(i).some(n=>ocean[n]))coast.push(i);
  let RS=0;const nearSea=i=>N4(i).some(n=>ocean[n]);
  const cost=i=>TER[i]===WATER?Infinity:1+Math.max(0,ELEV[i]-.5)*14+(TER[i]===MOUNTAIN?40:TER[i]===HILL?6:0)+Math.pow(fbm(tx(i)/3.2,ty(i)/3.2,SEED+51+RS*13),2)*70+Math.pow(fbm(tx(i)/9,ty(i)/9,SEED+77+RS*5),2)*30+(nearSea(i)?12:0)+(TER[i]===RIVER?-.5:0);
  function route(s,e){const dist=new Float64Array(W*H).fill(Infinity),prev=new Int32Array(W*H).fill(-1),heap=[];dist[s]=0;heap.push([0,s]);
    const up=()=>{let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
    const down=()=>{let i=0;for(;;){const l=i*2+1,r=l+1;let m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}};
    while(heap.length){const [d,u]=heap[0];const last=heap.pop();if(heap.length){heap[0]=last;down()}if(d>dist[u])continue;if(u===e)break;
      for(const n of N4(u)){const c=cost(n);if(c===Infinity)continue;const nd=d+c;if(nd<dist[n]){dist[n]=nd;prev[n]=u;heap.push([nd,n]);up()}}}
    if(prev[e]<0&&s!==e)return null;const p=[];for(let t=e;t>=0;t=prev[t])p.push(t);return p.reverse()}
  const cx=W/2,cy=H/2;
  for(let r=0;r<4;r++){
    const ang=r/4*Math.PI+.35+hash(r,1,SEED)*.4,dx=Math.cos(ang),dy=Math.sin(ang),off=(hash(r,2,SEED)-.5)*26;
    let s=-1,e=-1,bs=-1e9,be=-1e9;
    for(const i of coast){const px=tx(i)-cx,py=(ty(i)-cy)*1.5,pr=px*dx+py*dy,perp=Math.abs(-px*dy+py*dx-off);
      const a=pr-perp*.8+hash(i,r,9)*4,b=-pr-perp*.8+hash(i,r,11)*4;if(a>bs){bs=a;s=i}if(b>be){be=b;e=i}}
    RS=r;const p=route(s,e);if(!p||p.length<12)continue;
    for(const t of p)TER[t]=RIVER;
    for(let j=1;j<p.length;j++)RIVER_EDGES.push([p[j-1],p[j]]);
    const ws=N4(s).find(n=>ocean[n]),we=N4(e).find(n=>ocean[n]);for(const [end,w] of [[s,ws],[e,we]])if(w!=null)RIVER_EDGES.push([end,w]);
    RIVER_PATHS.push([...(ws!=null?[ws]:[]),...p,...(we!=null?[we]:[])]);
  }
}
genWorld();
const SPAWNS=(()=>{
  const cand=[];
  for(let y=6;y<H-6;y+=2)for(let x=6;x<W-6;x+=2){const i=idx(x,y);if(TER[i]!==GRASS)continue;
    let land=0,tot=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){tot++;const t=TER[idx(x+dx,y+dy)];if(t!==WATER&&t!==RIVER)land++}
    if(land/tot>.85)cand.push(i)}
  const out=[];let first=cand[0],bd=1e9;
  for(const c of cand){const d=Math.hypot(tx(c)-W*.22,ty(c)-H*.3);if(d<bd){bd=d;first=c}}
  out.push(first);
  while(out.length<5&&cand.length){let best=cand[0],bv=-1;for(const c of cand){let m=1e9;for(const o of out)m=Math.min(m,Math.hypot(tx(c)-tx(o),ty(c)-ty(o)));if(m>bv){bv=m;best=c}}out.push(best)}
  return out;
})();
// neutral villages scattered across the land, free to take
const NEUTRAL=(()=>{const out=[];
  for(let y=3;y<H-3;y++)for(let x=3;x<W-3;x++){const i=idx(x,y),t=TER[i];if(t!==GRASS&&t!==FOREST&&t!==DESERT&&t!==SAND)continue;if(hash(x,y,SEED+31)>.06)continue;
    if(SPAWNS.some(s=>Math.hypot(tx(s)-x,ty(s)-y)<7))continue;if(out.some(o=>Math.hypot(tx(o)-x,ty(o)-y)<9))continue;out.push(i)}
  return new Set(out)})();
const nearRiver=i=>N4(i).some(n=>TER[n]===RIVER);

/* ================= icons (drawn, no emoji) ================= */
const O="#1b1712";
function drawIcon(g,k,x,y,s){
  g.save();g.translate(x,y);g.scale(s/32,s/32);g.translate(-16,-16);g.lineJoin="round";g.lineCap="round";
  const P=(c,f)=>{g.fillStyle=c;g.beginPath();f();g.fill()};
  const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(a,b,w,h)};
  const S=(c,w,f)=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();f();g.stroke()};
  const C=(c,cx,cy,r)=>P(c,()=>g.arc(cx,cy,r,0,7));
  const tri=(a,b,c,d,e,f)=>()=>{g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath()};
  const house=(hx,hy,sc,roof,wall)=>{g.save();g.translate(hx,hy);g.scale(sc,sc);

function stats(c){
  let pop=0;const prod={gold:0,food:0,wood:0,stone:0,iron:0,mana:0},cnt={};
  for(const k in c.tiles||{}){const b=c.tiles[k];if(!b)continue;cnt[b]=(cnt[b]||0)+1;const d=B[b];if(!d)continue;if(d.pop)pop+=d.pop;
    if(d.prod){let m=1;const i=+k,t=TER[i];if(b==="farm"){if(nearRiver(i))m=1.5;if(t===DESERT)m*=.5}if(b==="mine"&&t===HILL)m=.6;for(const r in d.prod)prod[r]+=d.prod[r]*m}}
  let army=0,up=0,units=0;for(const u of UK){const n=c.army?.[u]||0;army+=n*UNITS[u].pop;up+=n*UNITS[u].up;units+=n}
  let queued=0;for(const q of c.queue||[])queued+=q.n*UNITS[q.u].pop;
  const civ=Math.max(0,pop-army);
  prod.gold+=civ*.35-up;prod.food-=civ*.18+army*.4;prod.mana+=(c.army?.mage||0)*.4;
  const sieged=!!(c.siege&&c.siege.until>Date.now());if(sieged){prod.food-=12+pop*.15;if(prod.gold>0)prod.gold*=.5}
  for(const k in prod)prod[k]*=ECO_SPEED;
  const villages=(cnt.village||0)+(cnt.village2||0)+(cnt.village3||0);
  return {pop,army,units,queued,civ,prod,cnt,villages,sieged};
}
function materialize(c,now){
  if(!c)return c;
  const from=c.t||now,dt=Math.min(Math.max(0,now-from),OFFLINE_CAP)/60000;
  const s=stats(c);c.res=c.res||{};
  for(const k of RK){const v=(c.res[k]||0)+s.prod[k]*dt;
    if(k==="food"&&v<0&&s.prod.food<0){const starve=Math.min(dt,-v/(-s.prod.food)),fr=Math.min(.6,.03*starve);c.army=c.army||{};for(const u of UK)if(c.army[u])c.army[u]=Math.floor(c.army[u]*(1-fr))}
    c.res[k]=Math.max(0,v)}
  c.starving=c.res.food<1&&s.prod.food<0;
  c.army=c.army||{};const left=[];
  for(const q of c.queue||[]){if(q.done<=now)c.army[q.u]=(c.army[q.u]||0)+q.n;else left.push(q)}
  c.queue=left;c.t=now;return c;
}

function makeStore(wid){
  const KEY="cw_world_"+wid;let data={};try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
  const leases={},listeners=new Set();let saveT=null;
  const changed=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}},250);for(const f of listeners)f()};
  const ops={
    get:p=>data[p]??null,
    set:(p,d)=>{data[p]=d;changed();return true},
    update:(p,d)=>{if(!data[p])throw new Error("missing");data[p]={...data[p],...d};changed();return true},
    delete:p=>{delete data[p];changed();return true},
    acquire:(p,h,ttl)=>{const now=Date.now(),l=leases[p];if(l&&l.exp>now&&l.h!==h)return{acquired:false};leases[p]={h,exp:now+clamp(ttl||1500,500,10000)};return{acquired:true}},
    lockget:(p,h,ttl)=>{const r=ops.acquire(p,h,ttl);return{acquired:r.acquired,data:r.acquired?(data[p]??null):null}},
  };
  return {ops,get data(){return data},listeners};
}
function netDB(getData,listeners,call,optimistic){
  const cp=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const snap=(p,v)=>({id:p.split("/").pop(),exists:v!=null,data:()=>v==null?undefined:cp(v),metadata:{fromCache:false,hasPendingWrites:false}});
  // remote writes show up at once locally and are confirmed by the host in the background
  const setDoc=(p,d)=>{if(!optimistic)return call("set",p,cp(d));optimistic(p,cp(d));call("set",p,cp(d)).catch(e=>toast("შენახვა ვერ მოხერხდა: "+e.message,"err"));return Promise.resolve(true)};
  const docRef=p=>({id:p.split("/").pop(),path:p,get:async()=>snap(p,await call("get",p)),set:d=>setDoc(p,d),lockGet:o=>call("lockget",p,o.holder,o.ttlMs),update:d=>call("update",p,cp(d)),delete:()=>call("delete",p),
    acquire:o=>call("acquire",p,o.holder,o.ttlMs),onSnapshot:n=>{const f=()=>n(snap(p,getData()[p]));listeners.add(f);setTimeout(f,0);return()=>listeners.delete(f)}});
  const colRef=p=>{const depth=p.split("/").length+1;const list=()=>{const d=getData();return Object.keys(d).filter(k=>k.startsWith(p+"/")&&k.split("/").length===depth).map(k=>snap(k,d[k]))};
    return{path:p,doc:id=>docRef(p+"/"+(id||rid(14))),get:async()=>{const d=list();return{docs:d,size:d.length,empty:!d.length}},
      onSnapshot:n=>{const f=()=>{const d=list();n({docs:d,size:d.length,empty:!d.length,docChanges:()=>[],metadata:{}})};listeners.add(f);setTimeout(f,0);return()=>listeners.delete(f)}}};
  return{doc:docRef,collection:colRef};
}
/* relay through a public MQTT broker over secure websockets: works across any Wi-Fi or mobile network */
const BROKER="wss://broker.emqx.io:8084/mqtt";
const topic=(wid,s)=>"countrywar-ka/v1/"+wid+"/"+s;
function mqttConnect(prefix){return mqtt.connect(BROKER,{clientId:prefix+rid(10),clean:true,keepalive:30,reconnectPeriod:3000,connectTimeout:10000})}
function startHost(wid){
  const store=makeStore(wid);
  db=netDB(()=>store.data,store.listeners,async(op,...a)=>store.ops[op](...a));
  const seen=new Map();
  const online=()=>{const now=Date.now();let n=1;for(const [k,t] of seen){if(now-t<30000)n++;else seen.delete(k)}return n};
  const cl=mqttConnect("cwh_");
  const pubState=()=>{if(cl.connected)cl.publish(topic(wid,"state"),JSON.stringify({d:store.data,n:online(),ts:Date.now()}),{retain:true,qos:1})};
  let bt=null;store.listeners.add(()=>{clearTimeout(bt);bt=setTimeout(pubState,80)});
  cl.on("connect",()=>{cl.subscribe([topic(wid,"req"),topic(wid,"hello")],{qos:1});NET.status="online";renderNet();pubState()});
  cl.on("reconnect",()=>{NET.status="wait";renderNet()});
  cl.on("offline",()=>{NET.status="offline";renderNet()});
  cl.on("error",()=>{NET.status="offline";renderNet()});
  cl.on("message",(tp,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch{return}
    if(!m||!m.c)return;
    const isNew=!seen.has(m.c);seen.set(m.c,Date.now());
    if(tp.endsWith("/hello")){if(isNew){NET.peers=online();renderNet()}pubState();return}
    let res=null,err=null;try{res=store.ops[m.op](...m.a)}catch(e){err=String(e.message||e)}
    cl.publish(topic(wid,"res/"+m.c),JSON.stringify({id:m.id,res,err}),{qos:1});
  });
  setInterval(()=>{if(cl.connected){NET.peers=online();renderNet();cl.publish(topic(wid,"hb"),JSON.stringify({n:NET.peers,ts:Date.now()}))}},5000);
}
function startClient(wid,onFirst){
  let mirror={},seq=0,first=true,lastHb=0;const listeners=new Set(),pending=new Map(),me_c="c"+rid(10);
  const cl=mqttConnect("cwc_");
  const hostUp=()=>Date.now()-lastHb<14000;
  const call=(op,...a)=>new Promise((res,rej)=>{
    if(!cl.connected)return rej(new Error("ინტერნეტთან კავშირი არ არის"));
    if(!hostUp())return rej(new Error("მასპინძელი არ არის ონლაინ"));
    const id=++seq;pending.set(id,{res,rej});cl.publish(topic(wid,"req"),JSON.stringify({c:me_c,id,op,a}),{qos:1});
    setTimeout(()=>{if(pending.has(id)){pending.delete(id);rej(new Error("მასპინძელი არ პასუხობს"))}},12000)});
  const recent={};
  db=netDB(()=>mirror,listeners,call,(p,d)=>{recent[p]={d,t:Date.now()};mirror={...mirror,[p]:d};for(const f of listeners)f()});
  const overlay=()=>{const now=Date.now();for(const p in recent){if(now-recent[p].t<2500)mirror[p]=recent[p].d;else delete recent[p]}};
  const hello=()=>{if(cl.connected)cl.publish(topic(wid,"hello"),JSON.stringify({c:me_c}))};
  cl.on("connect",()=>{cl.subscribe([topic(wid,"state"),topic(wid,"hb"),topic(wid,"res/"+me_c)],{qos:1},()=>hello())});
  cl.on("offline",()=>{NET.status="offline";renderNet()});
  cl.on("message",(tp,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch{return}
    if(tp.endsWith("/state")){mirror=m.d||{};overlay();if(m.ts&&Math.abs(Date.now()-m.ts)<20000){lastHb=Math.max(lastHb,Date.now());NET.status="online"}if(m.n)NET.peers=m.n;for(const f of listeners)f();if(first){first=false;onFirst()}}
    else if(tp.endsWith("/hb")){const was=hostUp();lastHb=Date.now();NET.peers=m.n||NET.peers;NET.status="online";renderNet();if(!was)hello()}
    else{const p=pending.get(m.id);if(p){pending.delete(m.id);m.err?p.rej(new Error(m.err)):p.res(m.res)}}});
  setInterval(()=>{hello();if(!hostUp()&&cl.connected){NET.status="hostoff";renderNet()}},10000);
  setTimeout(()=>{if(first)setWait("hostoff")},12000);
}

async function mutate(path,fn){
  const ref=db.doc(path);let cur=null;
  for(let i=0;;i++){
    if(ref.lockGet){const r=await ref.lockGet({holder:HOLDER,ttlMs:1500});if(r&&r.acquired){cur=r.data==null?null:JSON.parse(JSON.stringify(r.data));break}}
    else{const r=await ref.acquire({holder:HOLDER,ttlMs:1500});if(r&&r.acquired){const s=await ref.get();cur=s.exists?JSON.parse(JSON.stringify(s.data())):null;break}}
    if(i>14)throw new Error("სერვერი დაკავებულია, სცადე ხელახლა");
    await sleep(120+Math.random()*150);
  }
  const next=await fn(cur);
  if(next===undefined||next===null)return null;
  await ref.set(next);return next;
}

    case"diag":ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.fill();break;

$("#pane").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.train)act(()=>trainUnits(d.train,+d.n),UNITS[d.train].summon?UNITS[d.train].n+" გამოჩნდება":`${UNITS[d.train].n} × ${d.n}`);
  if(d.war)act(()=>declareWar(d.war),"ომი გამოცხადდა");
  if(d.peace)act(()=>offerPeace(d.peace),"ზავი გაგზავნილია");
  if(d.accept)act(()=>acceptPeace(d.accept),"მშვიდობა დამყარდა");
  if(d.sell)act(()=>market(d.sell,20,true));
  if(d.buy)act(()=>market(d.buy,20,false));
  if(t.id==="gSend")act(()=>sendGift($("#gTo").value,$("#gRes").value,+$("#gAmt").value),"გაგზავნილია");
  if(d.intercept)openIntercept(d.intercept);
  if(d.campret)act(()=>campReturn(d.campret),"ჯარი სახლში ბრუნდება");
  if(d.recall)act(()=>recallArmy(d.recall),"ჯარი ბრუნდება");
  if(d.redirect)startRedirect(d.redirect);
  if(d.buyship)act(()=>buildShip(),"გემი აშენდა");
  if(d.report&&attacks[d.report])showReport(attacks[d.report]);
  if(d.goto&&attacks[d.goto]){const P=armyPos(attacks[d.goto],Date.now());if(P){cam.x=P.x;cam.y=P.y;cam.z=Math.max(cam.z,1.4);selectedArmy=d.goto;selected=-1;renderTile()}}
  if(t.id==="sendArmy")openSend();
  if(t.id==="wallMode")startPlacing("wall");if(t.id==="claimMode")startPlacing("claim");if(t.id==="claimRing")act(async()=>{const n=await claimMany(borderRing());toast(`შემოიერთე ${n} უჯრა`,"good")});
  if(t.id==="invOpen")showInvite();
  if(t.id==="invCopyP")copyText(inviteLink(),$("#invInP"));
  if(t.id==="abandon"){if(t.dataset.sure)act(abandon);else{t.dataset.sure=1;t.textContent="დარწმუნებული ხარ? ყველაფერი წაიშლება"}}
  if(t.id==="resetWorld"){if(t.dataset.sure)act(resetWorld,"სამყარო გასუფთავდა");else{t.dataset.sure=1;t.textContent="ნამდვილად? ყველა ქვეყანა წაიშლება"}}
});
$("#pane").addEventListener("submit",e=>{if(e.target.id!=="chatForm")return;e.preventDefault();const v=$("#chatIn").value.trim();if(!v)return;$("#chatIn").value="";postChat(v)});

/* tile card */
function selectTile(i){selected=i;selectedArmy=null;renderTile()}
function renderTile(){
  const el=$("#tile");
  if(selectedArmy&&me()){const a=attacks[selectedArmy],P=a&&armyPos(a,Date.now());
    if(P){const C=countries[a.from],T=countries[a.to],u=P.going?a.units:a.result?.survivors||{},ic=a.kind==="intercept";
      const what=a.status==="besieging"?`ალყა: ${esc(T?.name||"")}`:a.status==="camped"?"ბანაკი":!P.going?"ბრუნდება სახლში":ic?`მიდის შესახვედრად: ${esc(T?.name||"")}`:a.kind==="camp"?"მიდის ბანაკის გასაშლელად":`${MODES[a.mode||"direct"].n}${a.naval?" (ზღვით)":""}: ${esc(T?.name||"")}`;
      const canI=(P.going||a.status==="besieging"||a.status==="camped")&&!ic&&a.from!==ME&&atWar(ME,a.from);
      el.hidden=false;el.innerHTML=`<button class="x" aria-label="დახურვა" id="tileX">×</button><h4 style="color:${C?.color}">${esc(C?.name||"?")}</h4>
        <div class="muted" style="font-size:12px">${what}${a.status==="camped"?"":` · <span data-until="${a.status==="besieging"?a.siegeEnd:P.going?a.arrive:a.returnAt}">${mmss((a.status==="besieging"?a.siegeEnd:P.going?a.arrive:a.returnAt)-Date.now())}</span>`}</div>
        <div style="margin-top:8px">${unitsHTML(u)}</div>${a.to===ME&&P.going&&!ic?'<p style="color:var(--danger);margin:8px 0 0;font-size:12px">ეს ჯარი შენზე მოდის!</p>':""}
        ${canI?`<div class="acts"><button class="btn sm gold" data-intercept="${esc(a.id)}">${a.status==="besieging"?"ალყის გარღვევა":a.status==="camped"?"ბანაკზე თავდასხმა":"დახვედრა"}</button></div>`:""}
        ${canCommand(a)?`<div class="acts">${a.kind!=="intercept"?`<button class="btn sm gold" data-redirect="${esc(a.id)}">გზის შეცვლა</button>`:""}<button class="btn sm" data-recall="${esc(a.id)}">დაბრუნება</button>${a.status==="camped"?`<button class="btn sm" data-sendcamp="1">ნაწილის გაგზავნა</button>`:""}</div>`:""}`;paintIcons(el);return}
    selectedArmy=null}
  if(selected<0||!me()){el.hidden=true;return}el.hidden=false;
  const i=selected,o=ownerOf(i),c=live(ME),t=TER[i],b=o?o.tiles[i]:"",neutral=!o&&NEUTRAL.has(i);
  let h=`<button class="x" aria-label="დახურვა" id="tileX">×</button><h4>${b?B[b].n:neutral?"ნეიტრალური სოფელი":TNAME[t]}</h4><div class="muted" style="font-size:12px">${o?`<span style="color:${o.color};font-weight:700">${esc(o.name)}</span> · `:""}${TNAME[t]}</div>`;
  if(o&&o.uid===ME){
    if(!b){const opts=BUILD_ORDER.filter(k=>B[k].on.includes(t)&&(!B[k].coast||N4(i).some(n=>TER[n]===WATER)));
      h+=opts.length?`<div class="list" style="margin-top:10px">`+opts.map(k=>{const cost=buildCost(c,k);return `<div class="item" style="padding:6px 8px">${icn(k)}<span class="tx"><b>${B[k].n}</b>${prodHTML(k)||`<span>${esc(B[k].d)}</span>`}${costHTML(cost,c)}</span><button class="btn sm ${canPay(c,cost)?"gold":""}" data-build="${k}">აშენება</button></div>`}).join("")+`</div>`
        :`<p class="muted">აქ ვერაფერს ააშენებ.</p>`}
    else if(UPG[b]){const nx=UPG[b];h+=`<div class="item" style="margin-top:10px">${icn(nx)}<span class="tx"><b>${B[nx].n}</b><span>+${B[nx].prod.gold} ოქრო/წთ, +${B[nx].pop} მოსახლე</span>${costHTML(B[nx].cost,c)}</span><button class="btn sm ${canPay(c,B[nx].cost)?"gold":""}" data-upg="1">გაუმჯობესება</button></div>
      <div class="acts"><button class="btn sm red" data-demolish="1">დანგრევა</button></div>`}
    else if(b==="port")h+=`<div class="item" style="margin-top:10px">${icn("ship")}<span class="tx"><b>გემები: ${c.ships||0}</b><span>თითო გემი ${SHIP_CAP} ჯარისკაცს გადაიყვანს</span>${costHTML(SHIP_COST,c)}</span><button class="btn sm gold" data-ship="1">გემის აშენება</button></div><div class="acts"><button class="btn sm red" data-demolish="1">დანგრევა</button></div>`;
    else if(b!=="capital")h+=`<div class="acts"><button class="btn sm red" data-demolish="1">დანგრევა</button></div>`;
  }else if(!o){
    if(t!==WATER&&adjMine(i)){const cost=claimCost(c,i);h+=`<div class="acts"><button class="btn sm gold" data-claim="1">${neutral?"სოფლის შემოერთება":"შემოერთება"}</button><button class="btn sm" data-claimmode="1">ბევრის მონიშვნა</button>${costHTML(cost,c)}</div>`}
    else if(t!==WATER)h+=`<p class="muted" style="margin:8px 0 0;font-size:12px">ჯერ მიაღწიე შენი საზღვრით.</p>`;
  }else if(o.alive!==false){
    h+=`<div class="acts">${atWar(ME,o.uid)?`<button class="btn sm red" data-attack="1">ჯარის გაგზავნა</button>`:`<button class="btn sm red" data-war="${esc(o.uid)}">ომის გამოცხადება</button>`}</div>`;
  }

  const key=a.id+":c";
  await mutateMe(c=>{if((c.applied||[]).includes(key))return false;for(const k in a.result.survivors)c.army[k]=(c.army[k]||0)+a.result.survivors[k];
    for(const k of RK)c.res[k]+=a.result.loot[k]||0;if(a.result.survivorsN)pushLog(c,`ჯარი დაბრუნდა (${a.result.survivorsN})`);c.applied=[key,...(c.applied||[])].slice(0,60)});
  await mutate("attacks/"+a.id,cur=>{if(!cur)return;cur.status="done";return cur});
}
async function abandon(){
  await mutate("meta/slots",cur=>{cur=cur||{slots:{}};for(const k in cur.slots)if(cur.slots[k]===ME)delete cur.slots[k];return cur});
  const nm=countries[ME]?.name;await db.doc("countries/"+ME).delete();delete countries[ME];postChat(`${nm} გაქრა რუკიდან`,true);showOnboarding();
}
async function resetWorld(){
  for(const id in countries)await db.doc("countries/"+id).delete();
  for(const id in attacks)await db.doc("attacks/"+id).delete();
  await db.doc("meta/slots").delete();await db.doc("chat/main").delete();showOnboarding();
}

/* ================= onboarding ================= */
const draft={ruler:"",name:"",currency:"",flag:{p:"h3",c:["#c8102e","#ffffff","#1f3a93"],e:"★",ec:"#f2c771"},color:null};
function showOnboarding(){
  $("#hud").hidden=true;$("#side").hidden=true;$("#tile").hidden=true;
  let ov=$("#onb");if(ov)ov.remove();ov=document.createElement("div");ov.id="onb";ov.className="overlay";
  const taken=alive().map(c=>c.color),full=alive().length>=5;
  if(!draft.color||taken.includes(draft.color))draft.color=COLORS.find(c=>!taken.includes(c));
  ov.innerHTML=`<div class="card">
    <h1>Country War</h1><p class="sub">${alive().length}/5 ქვეყანა</p>
    ${full?`<p>სამყარო სავსეა.</p><button class="btn gold" id="oWatch">რუკის ნახვა</button>`:`
    <label class="field">შენი სახელი<input id="oRuler" maxlength="20" value="${esc(draft.ruler)}" placeholder="მაგ. დავით აღმაშენებელი"></label>
    <label class="field">ქვეყნის სახელი<input id="oName" maxlength="22" value="${esc(draft.name)}" placeholder="მაგ. ქართლის სამეფო"></label>
    <label class="field">ვალუტა<input id="oCur" maxlength="14" value="${esc(draft.currency)}" placeholder="მაგ. დრამა, ლარი"></label>
    <div class="field" style="margin-bottom:4px">დროშა</div>
    <div class="flagEd"><canvas id="oFlag" width="360" height="240"></canvas><div>
      <div class="pats">${PATS.map(p=>`<button data-pat="${p}" class="${draft.flag.p===p?"on":""}" aria-label="${p}"><canvas width="72" height="48" data-pp="${p}"></canvas></button>`).join("")}</div>
      <div class="cols"><label>1<input type="color" data-ci="0" value="${draft.flag.c[0]}"></label><label>2<input type="color" data-ci="1" value="${draft.flag.c[1]}"></label>
      <label>3<input type="color" data-ci="2" value="${draft.flag.c[2]}"></label><label>გერბი<select id="oEm">${EMBLEMS.map(e=>`<option ${draft.flag.e===e?"selected":""} value="${e}">${e||"—"}</option>`).join("")}</select></label>
      <label>ფერი<input type="color" id="oEc" value="${draft.flag.ec}"></label></div></div></div>
    <div class="field">ფერი რუკაზე</div>
    <div class="swatches" style="margin-bottom:18px">${COLORS.map(c=>`<button data-col="${c}" style="background:${c}" class="${draft.color===c?"on":""}" ${taken.includes(c)?"disabled":""} aria-label="ფერი"></button>`).join("")}</div>
    <button class="btn gold" id="oGo" style="width:100%;padding:12px;font-size:16px">დაარსება</button>`}
  </div>`;
  $("#app").appendChild(ov);
  const redraw=()=>{const f=ov.querySelector("#oFlag");if(!f)return;const g=f.getContext("2d");g.clearRect(0,0,360,240);drawFlag(g,draft.flag,0,0,360,240);
    ov.querySelectorAll("[data-pp]").forEach(cn=>{drawFlag(cn.getContext("2d"),{...draft.flag,p:cn.dataset.pp,e:""},0,0,72,48)})};
  redraw();
  ov.addEventListener("input",e=>{const t=e.target;if(t.id==="oRuler")draft.ruler=t.value;if(t.id==="oName")draft.name=t.value;if(t.id==="oCur")draft.currency=t.value;
    if(t.dataset.ci)draft.flag.c[+t.dataset.ci]=t.value;if(t.id==="oEm")draft.flag.e=t.value;if(t.id==="oEc")draft.flag.ec=t.value;redraw()});
  ov.addEventListener("change",e=>{if(e.target.id==="oEm"){draft.flag.e=e.target.value;redraw()}});
  ov.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.pat){draft.flag.p=b.dataset.pat;ov.querySelectorAll("[data-pat]").forEach(x=>x.classList.toggle("on",x===b));redraw()}
    if(b.dataset.col){draft.color=b.dataset.col;ov.querySelectorAll("[data-col]").forEach(x=>x.classList.toggle("on",x===b))}
    if(b.id==="oWatch")ov.remove();
    if(b.id==="oGo"){b.disabled=true;foundCountry().then(()=>{ov.remove();renderAll(true);if(NET.role==="host"&&alive().length<=1)showInvite()}).catch(err=>{toast(err.message||String(err),"err");b.disabled=false})}});
}
async function foundCountry(){
  const ruler=draft.ruler.trim(),name=draft.name.trim(),currency=draft.currency.trim()||"ოქრო";
  if(!ruler)throw new Error("ჩაწერე შენი სახელი");if(!name)throw new Error("დაარქვი სახელი ქვეყანას");
  let slot=-1;
  await mutate("meta/slots",async cur=>{cur=cur||{slots:{}};
    for(const k in cur.slots){if(cur.slots[k]===ME){slot=+k;return cur}}
    for(let k=0;k<5;k++){const u=cur.slots[k];if(!u){slot=k;break}const s=await db.doc("countries/"+u).get();if(!s.exists||s.data().alive===false){slot=k;break}}
    if(slot<0)throw new Error("სამყარო სავსეა (5/5)");cur.slots[slot]=ME;return cur});
  const sp=SPAWNS[slot],tiles={};const X=tx(sp),Y=ty(sp);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(Math.abs(dx)+Math.abs(dy)>3)continue;const x=X+dx,y=Y+dy;if(x<0||y<0||x>=W||y>=H)continue;const i=idx(x,y);if(TER[i]===WATER||OWNER[i]>=0)continue;tiles[i]=""}
  tiles[sp]="capital";
  const taken=alive().filter(c=>c.uid!==ME).map(c=>c.color);const color=taken.includes(draft.color)?COLORS.find(c=>!taken.includes(c)):draft.color;
  const doc={uid:ME,ruler,name,currency,color,flag:JSON.parse(JSON.stringify(draft.flag)),slot,capital:sp,created:Date.now(),t:Date.now(),alive:true,
    res:{gold:300,food:200,wood:250,stone:100,iron:20,mana:0},tiles,army:{},queue:[],wars:[],peace:[],applied:[],log:[{t:Date.now(),m:"ქვეყანა დაარსდა"}]};
  await db.doc("countries/"+ME).set(doc);countries[ME]=doc;rebuildOwners();
  cam.x=X*TS+8;cam.y=Y*TS+8;cam.z=1.8;
  postChat(`ახალი ქვეყანა: ${name} (${ruler})`,true);
}

/* ================= boot ================= */
let isOwnerViewer=false,booted=false,lastPane=0;
function renderAll(force){
  if(!booted)return;
  const has=!!me();$("#side").hidden=!has;
  if(has){renderTabs();renderPane(force)}
  renderHUD();renderTile();
}
function banner(html){let b=$("#banner");if(!b){b=document.createElement("div");b.id="banner";b.className="plate";$("#app").appendChild(b)}b.innerHTML=html;b.hidden=false}
function setWait(kind){banner(kind==="hostoff"?`<h2>მასპინძელი არ არის ონლაინ</h2><p class="muted">ეს სამყარო მისი შემქმნელის ბრაუზერში ინახება. როცა ის თამაშს გახსნის, აქ ავტომატურად შეხვალ.</p>`:`<h2>უკავშირდება…</h2>`)}
function landing(){return new Promise(res=>{
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="card"><h1>Country War</h1><p class="sub">შექმენი სამყარო და მოიწვიე მეგობრები. სამყარო შენს ბრაუზერში შეინახება.</p>
    <button class="btn gold" id="lNew" style="width:100%;padding:12px;font-size:16px">ახალი სამყაროს შექმნა</button>
    <p class="muted" style="font-size:12px;margin:14px 0 0">თუ მეგობარმა ლინკი გამოგიგზავნა, გახსენი ის ლინკი.</p></div>`;
  $("#app").appendChild(ov);ov.querySelector("#lNew").onclick=()=>{ov.remove();res()}})}
function playerId(){
  const q=new URLSearchParams(location.search).get("p");const key="cw_pid"+(q?"_"+q:"");
  try{let v=localStorage.getItem(key);if(!v){v="p_"+rid(16);localStorage.setItem(key,v)}return v}catch{return "p_"+rid(16)}
}
addEventListener("hashchange",()=>location.reload());
async function boot(){
  resize();drawTerrain();drawTerritory();requestAnimationFrame(frame);
  const cl=window.claude;
  if(cl&&typeof cl.use==="function"){
    const [d,u]=await Promise.all([cl.use("db"),cl.use("user")]);db=d;user=u;
    if(!db||!user){banner(`<h2>შესვლა საჭიროა</h2><p class="muted">შედი claude.ai-ზე იმ ანგარიშით, რომელზეც თამაში გაგიზიარეს.</p>`);return}
    ME=await user.id();isOwnerViewer=await user.isOwner();
    if(!ME){banner(`<p>შენი ანგარიში ვერ ამოვიცანი.</p>`);return}
  }else{
    if(typeof mqtt==="undefined"){banner(`<h2>ქსელი ვერ ჩაიტვირთა</h2><p class="muted">განაახლე გვერდი.</p>`);return}
    ME=playerId();
    const m=location.hash.match(/^#w-([a-z0-9]+)$/);let hostId=null;try{hostId=localStorage.getItem("cw_host")}catch{}
    if(m&&m[1]!==hostId){
      NET.role="client";NET.wid=m[1];setWait("wait");
      await new Promise(r=>startClient(m[1],r));
      $("#banner")?.remove();
    }else{
      if(!m&&!hostId){await landing();hostId=rid(10);try{localStorage.setItem("cw_host",hostId)}catch{}}
      NET.role="host";NET.wid=m?m[1]:hostId;history.replaceState(null,"","#w-"+NET.wid);isOwnerViewer=true;
      startHost(NET.wid);
    }
  }
  ME=String(ME);
  db.collection("countries").onSnapshot(s=>{const next={};for(const d of s.docs){const v=d.data();if(v)next[d.id]={...v,uid:d.id}}countries=next;rebuildOwners();
    if(!booted){booted=true;const c=me();if(c){cam.x=tx(c.capital)*TS+8;cam.y=ty(c.capital)*TS+8;cam.z=1.8}else showOnboarding()}
    else if(!me()&&!$("#onb")&&countries[ME]?.alive===false){toast("შენი ქვეყანა დაეცა. შეგიძლია ახალი დააარსო.","err");showOnboarding()}
    else if(me()&&$("#onb"))$("#onb").remove();
    renderAll()},e=>toast("მონაცემები ვერ ჩაიტვირთა","err"));
  db.collection("attacks").onSnapshot(s=>{const next={};for(const d of s.docs){const v=d.data();if(v)next[d.id]={...v,id:d.id}}
    for(const id in next){const a=next[id],pr=attacks[id];if(a.to===ME&&a.status==="marching"&&a.kind!=="intercept"&&!pr&&booted)toast(`${countries[a.from]?.name||"მტერი"} გიტევს!`,"err");
      if(a.status==="returning"&&a.result&&!a.result.missed&&!a.result.camp&&((pr&&(pr.status==="marching"||pr.status==="besieging"))||(!pr&&Date.now()-(a.result.at||0)<6000))){const loc=a.retFrom??a.target;FX.push({x:tx(loc)*TS+8,y:ty(loc)*TS+8,t0:Date.now(),col:countries[a.from]?.color||"#fff"});const sc=sceneFromAttack(a);if(sc)SCENES.push(sc)}}
    attacks=next;renderAll()},()=>{});
  db.doc("chat/main").onSnapshot(s=>{chat=s.exists?(s.data().msgs||[]):[];if(tab==="chat")renderPane(false);else if(booted&&me())renderTabs()},()=>{});
  setInterval(()=>{renderHUD();if(Date.now()-lastPane>4000){lastPane=Date.now();renderPane(false);renderTile()}},1000);
  setInterval(resolveAttacks,2500);
  setInterval(checkReports,1500);
}
boot();
</script>
