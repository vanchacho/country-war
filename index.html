<body style="margin:0">
<title>Country War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* War room: the whole screen is the map; brass-trimmed ink panels float over it */
:root{
  --ink:#121821; --panel:#1a2230; --panel2:#222d3e; --line:#33435a; --fg:#ece6d6; --muted:#97a3b5;
  --brass:#d4a24a; --brass2:#f2c771; --danger:#e3624f; --ok:#73c27a;
  --display:"Noto Serif Georgian",Georgia,serif; --body:"Noto Sans Georgian",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#map.drag{cursor:grabbing}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--brass);background:#2a374b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--brass);color:#1a1408;border-color:var(--brass2)}
.btn.gold:hover:not(:disabled){background:var(--brass2)}
.btn.red{background:#5a2620;border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);letter-spacing:.03em}
.tag.war{color:#ffb4a8;border-color:var(--danger);background:#3a1a17}
.tag.peace{color:#bfe8c2;border-color:#3f6f45}
/* HUD */
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:stretch;pointer-events:none;flex-wrap:wrap}
#hud>*{pointer-events:auto}
.plate{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
#who{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px}
#who canvas{border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
#who .nm{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1}
#who .rl{font-size:11px;color:var(--muted)}
#res{display:flex;gap:2px;padding:4px;flex-wrap:wrap}
.r{display:flex;flex-direction:column;padding:3px 10px;min-width:70px;border-radius:7px}
.r b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.r small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.r small.neg{color:var(--danger)}
.r .k{font-size:10px;letter-spacing:.06em;color:var(--brass);text-transform:uppercase;white-space:nowrap}
/* side panel */
#side{position:absolute;top:84px;right:8px;bottom:8px;width:370px;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{flex:1;background:none;border:0;padding:10px 6px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
#tabs button.on{color:var(--brass2);border-bottom-color:var(--brass)}
#tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:4px;vertical-align:middle}
#pane{flex:1;overflow-y:auto;padding:14px}
#pane h3{font-family:var(--display);font-size:15px;margin:16px 0 8px;color:var(--brass2);text-wrap:balance}
#pane h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.item .ic{font-size:22px;width:30px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:13.5px}
.item .tx span{font-size:11.5px;color:var(--muted)}
.cost{font-size:11.5px;font-variant-numeric:tabular-nums}
.cost .no{color:var(--danger)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right}
#collapse{display:none}
/* tile card */
#tile{position:absolute;left:8px;bottom:8px;width:330px;padding:12px 14px;max-height:50%;overflow:auto}
#tile h4{margin:0 0 2px;font-family:var(--display);font-size:15px}
#tile .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#tile .x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:18px;color:var(--muted)}
#place{position:absolute;left:50%;top:92px;transform:translateX(-50%);padding:8px 14px;display:flex;gap:10px;align-items:center}
/* overlays */
.overlay{position:absolute;inset:0;background:rgba(8,11,16,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.card h1{font-family:var(--display);font-weight:800;font-size:34px;margin:0;letter-spacing:.01em;color:var(--brass2)}
.card h2{font-family:var(--display);font-size:20px;margin:0 0 6px}
.card .sub{margin:4px 0 18px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.field input{font-size:15px}
.flagEd{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:start;margin:6px 0 14px}
.flagEd canvas{width:180px;height:120px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.pats{display:flex;flex-wrap:wrap;gap:5px}
.pats button{width:40px;height:28px;padding:0;border:2px solid var(--line);border-radius:4px;background:var(--ink)}
.pats button.on{border-color:var(--brass2)}
.pats canvas{width:36px;height:24px;display:block;box-shadow:none;border-radius:2px}
.cols{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:end}
.cols label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);align-items:center}
.cols input[type=color]{width:42px;height:32px;padding:2px;border-radius:6px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.swatches button.on{border-color:#fff}
.swatches button:disabled{opacity:.18;cursor:not-allowed}
.modal .units{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.modal .units .item input{width:80px}
#toasts{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:40;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.4);font-size:13px;animation:tin .2s ease-out}
.toast.err{border-color:var(--danger);color:#ffd0c8}
.toast.good{border-color:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.msg b{margin-right:4px}
.msg.sys{color:var(--brass2);font-size:12px}
.msg time{color:var(--muted);font-size:10.5px;margin-left:4px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.bar{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brass)}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:440px;text-align:center;padding:22px;z-index:30}
@media (max-width:760px){
  #side{top:auto;left:8px;right:8px;width:auto;height:46%}
  #side.min{height:44px}
  #collapse{display:block;position:absolute;right:6px;top:4px;z-index:2;background:none;border:0;font-size:18px;color:var(--muted);padding:6px 10px}
  #tabs{padding-right:40px}
  #tile{left:8px;right:8px;width:auto;bottom:calc(46% + 16px);max-height:34%}
  #side.min ~ #tile{bottom:60px}
  .r{min-width:58px;padding:2px 6px}
  .r b{font-size:13px}
  #who .nm{font-size:14px}
  .flagEd{grid-template-columns:1fr}
  #place{top:auto;bottom:calc(46% + 16px)}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app">
  <canvas id="map" aria-label="რუკა"></canvas>
  <div id="hud" hidden>
    <div id="who" class="plate"><canvas id="myFlag" width="42" height="28"></canvas><div><div class="nm" id="myName"></div><div class="rl" id="myRuler"></div></div></div>

  <div id="place" class="plate" hidden></div>
  <div id="toasts"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>

<script>
"use strict";
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.floor(n||0);return Math.abs(n)>=100000?(n/1000).toFixed(0)+"k":Math.abs(n)>=10000?(n/1000).toFixed(1)+"k":String(n)};
const fmtR=n=>(n>=0?"+":"")+(Math.abs(n)>=100?Math.round(n):n.toFixed(1));
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000),m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")};
function hash(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){let t=0,a=1,f=1,n=0;for(let o=0;o<5;o++){t+=vnoise(x*f,y*f,s+o*17)*a;n+=a;a*=.5;f*=2}return t/n}

/* ================= world ================= */
const W=150,H=96,TS=16,SEED=20261108;
const WATER=0,SAND=1,GRASS=2,FOREST=3,HILL=4,MOUNTAIN=5,RIVER=6,DESERT=7;
const TNAME=["ზღვა","სანაპირო","მინდორი","ტყე","ბორცვი","მთა","მდინარე","უდაბნო"];
const TER=new Uint8Array(W*H), ELEV=new Float32Array(W*H);
const idx=(x,y)=>y*W+x, tx=i=>i%W, ty=i=>(i/W)|0;
const N4=i=>{const x=tx(i),y=ty(i),r=[];if(x>0)r.push(i-1);if(x<W-1)r.push(i+1);if(y>0)r.push(i-W);if(y<H-1)r.push(i+W);return r};
function genWorld(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const nx=x/W-.5,ny=y/H-.5,d=Math.sqrt(nx*nx+ny*ny*1.2)*2;
    ELEV[idx(x,y)]=fbm(x/24,y/24,SEED)*1.2-Math.pow(d,3)*.7+fbm(x/7,y/7,SEED+5)*.08;
  }
  // thresholds by percentile so the land share stays stable (~58% land)
  const sorted=Float32Array.from(ELEV).sort(),q=p=>sorted[Math.floor(p*(sorted.length-1))];
  const tW=q(.42),tS=q(.46),tH=q(.84),tM=q(.93);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=idx(x,y),e=ELEV[i],m=fbm(x/20,y/20,SEED+99);let t;
    if(e<tW)t=WATER;else if(e<tS)t=SAND;else if(e>tM)t=MOUNTAIN;else if(e>tH)t=HILL;
    else if(m>.56)t=FOREST;else if(m<.40)t=DESERT;else t=GRASS;
    TER[i]=t;ELEV[i]=(e-tW)/(tM-tW)*.45+.33; // normalise: sea level .33
  }
  // rivers flow downhill from highlands to the sea
  const srcs=[];
  for(let y=4;y<H-4;y+=2)for(let x=4;x<W-4;x+=2){const i=idx(x,y);if((TER[i]===HILL||TER[i]===MOUNTAIN)&&hash(x,y,SEED+7)<.35)srcs.push(i)}
  srcs.sort((a,b)=>hash(a,0,SEED+3)-hash(b,0,SEED+3));
  const picked=[];
  for(const s of srcs){if(picked.length>=16)break;if(picked.every(p=>Math.hypot(tx(p)-tx(s),ty(p)-ty(s))>12))picked.push(s)}
  for(const s of picked){
    let cur=s,up=0;const seen=new Set([cur]);
    for(let step=0;step<400;step++){
      if(TER[cur]===WATER)break;
      const merge=TER[cur]===RIVER&&step>0;
      TER[cur]=RIVER;if(merge)break;
      let best=-1,be=1e9;
      for(const n of N4(cur)){if(seen.has(n))continue;const e=ELEV[n]+hash(n,step,SEED)*.004;if(e<be){be=e;best=n}}
      if(best<0)break;
      if(be>ELEV[cur]&&++up>6){ // stuck in a basin: becomes a small lake
        for(const n of [cur,...N4(cur)])if(TER[n]!==MOUNTAIN)TER[n]=WATER;break}
      RIVER_EDGES.push([cur,best]);seen.add(best);cur=best;
    }
  }
}
const RIVER_EDGES=[];
genWorld();
// 5 spawn regions, as far apart as possible
const SPAWNS=(()=>{
  const cand=[];
  for(let y=6;y<H-6;y+=2)for(let x=6;x<W-6;x+=2){const i=idx(x,y);if(TER[i]!==GRASS)continue;
    let land=0,tot=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){tot++;const t=TER[idx(x+dx,y+dy)];if(t!==WATER&&t!==RIVER)land++}
    if(land/tot>.85)cand.push(i)}
  const out=[];let first=cand[0],bd=1e9;
  for(const c of cand){const d=Math.hypot(tx(c)-W*.22,ty(c)-H*.3);if(d<bd){bd=d;first=c}}
  out.push(first);
  while(out.length<5&&cand.length){let best=cand[0],bv=-1;for(const c of cand){let m=1e9;for(const o of out)m=Math.min(m,Math.hypot(tx(c)-tx(o),ty(c)-ty(o)));if(m>bv){bv=m;best=c}}out.push(best)}
  return out;
})();
const nearRiver=i=>N4(i).some(n=>TER[n]===RIVER);

/* ================= rules ================= */
const RES={gold:{n:"ოქრო",k:"ხაზინა"},food:{n:"საკვები",k:"საკვები"},wood:{n:"ხე",k:"ხე"},stone:{n:"ქვა",k:"ქვა"},iron:{n:"რკინა",k:"რკინა"}};
const RK=["gold","food","wood","stone","iron"];
const LAND=[SAND,GRASS,FOREST,HILL,DESERT];
const B={
  capital:{n:"დედაქალაქი",i:"🏰",prod:{gold:6,food:8,wood:3,stone:2},pop:30,noBuild:true},
  house:{n:"სახლი",i:"🏠",cost:{wood:40,gold:20},pop:15,on:LAND,d:"+15 მოსახლე: მეტი გადასახადი და ადგილი ჯარისთვის"},
  farm:{n:"ფერმა",i:"🌾",cost:{wood:25,gold:15},prod:{food:8},on:[GRASS,SAND,DESERT],d:"+8 საკვები/წთ. მდინარესთან ×1.5, უდაბნოში ×0.5"},
  lumber:{n:"სახერხი",i:"🪓",cost:{gold:25},prod:{wood:6},on:[FOREST],d:"+6 ხე/წთ. შენდება მხოლოდ ტყეში"},
  quarry:{n:"ქვის სამტეხლო",i:"⛏️",cost:{wood:40,gold:25},prod:{stone:4},on:[HILL,MOUNTAIN],d:"+4 ქვა/წთ. ბორცვზე ან მთაზე"},
  mine:{n:"რკინის მაღარო",i:"⚒️",cost:{wood:50,stone:30,gold:40},prod:{iron:2.5},on:[MOUNTAIN,HILL],d:"+2.5 რკინა/წთ მთაზე, ბორცვზე ×0.6"},
  market:{n:"ბაზარი",i:"🏪",cost:{wood:80,stone:50,gold:60},prod:{gold:10},on:LAND,d:"+10 ოქრო/წთ და ვაჭრობის უფლება"},
  barracks:{n:"ყაზარმა",i:"⚔️",cost:{wood:90,stone:40,gold:50},on:LAND,d:"ამზადებს ხმლიან მეომრებს და შუბოსნებს"},
  range:{n:"სასროლეთი",i:"🎯",cost:{wood:110,gold:60},on:LAND,d:"ამზადებს მშვილდოსნებს"},
  stable:{n:"თავლა",i:"🐎",cost:{wood:120,stone:60,gold:100},on:LAND,d:"ცხენოსნები: რაინდი, შვილდოსანი მხედარი"},
  workshop:{n:"სახელოსნო",i:"🛠️",cost:{wood:160,stone:120,iron:30,gold:120},on:LAND,d:"აგებს კატაპულტებს"},
  tower:{n:"საგუშაგო კოშკი",i:"🗼",cost:{stone:70,wood:30,gold:20},on:[...LAND,MOUNTAIN],d:"+25% დაცვა 3 უჯრის რადიუსში და ისრების ზალპი"},
  wall:{n:"გალავანი",i:"🧱",cost:{stone:12},on:[...LAND,MOUNTAIN],d:"+12% დაცვა 2 უჯრის რადიუსში. დახატე საზღვარზე"},
};
const BUILD_ORDER=["house","farm","lumber","quarry","mine","market","barracks","range","stable","workshop","tower","wall"];
const UNITS={
  sword:{n:"ხმლიანი მეომარი",i:"🗡️",atk:10,def:8,spd:3,pop:1,up:.15,time:8,cost:{gold:15,food:10,iron:2},req:["barracks"],d:"მყარი ქვეითი"},

  archer:{n:"მშვილდოსანი",i:"🏹",atk:12,def:5,spd:3,pop:1,up:.15,time:8,cost:{gold:14,food:8,wood:12},req:["range"],d:"შორიდან მსროლელი"},

  if(ptrs.size===2){const [p,q]=[...ptrs.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y),z:cam.z};moved=true}});
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();const [wx,wy]=s2w(e.clientX-r.left,e.clientY-r.top);
  const tX=Math.floor(wx/TS),tY=Math.floor(wy/TS);hoverTile=tX>=0&&tX<W&&tY>=0&&tY<H?idx(tX,tY):-1;
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [p,q]=[...ptrs.values()];cam.z=pinch.z*Math.hypot(p.x-q.x,p.y-q.y)/pinch.d;clampCam();return}
  if(dragStart){const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.hypot(dx,dy)>6){moved=true;cv.classList.add("drag")}
    if(moved&&!placing){cam.x=dragStart.cx-dx/cam.z;cam.y=dragStart.cy-dy/cam.z;clampCam()}
    if(placing&&moved&&ptrs.size===1)placeWallAt(hoverTile)}});
const endPtr=e=>{ptrs.delete(e.pointerId);cv.classList.remove("drag");
  if(ptrs.size===0){if(!moved&&dragStart&&hoverTile>=0){placing?placeWallAt(hoverTile):selectTile(hoverTile)}dragStart=null;pinch=null}
  else if(ptrs.size===1){const [p]=[...ptrs.values()];dragStart={x:p.x,y:p.y,cx:cam.x,cy:cam.y};pinch=null}};
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;const [wx,wy]=s2w(sx,sy);
  cam.z*=Math.exp(-e.deltaY*.0015);clampCam();cam.x=wx-(sx-vw/2)/cam.z;cam.y=wy-(sy-vh/2)/cam.z;clampCam()},{passive:false});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(placing)stopPlacing();else{selected=-1;renderTile()}}});

function countNear(c,t,type,r){let n=0;const X=tx(t),Y=ty(t);for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=X+dx,y=Y+dy;if(x<0||y<0||x>=W||y>=H)continue;if(c.tiles?.[idx(x,y)]===type)n++}return n}
function travelTime(from,to,units){
  const spd=Math.max(...Object.keys(units).filter(u=>units[u]>0).map(u=>UNITS[u].spd),1);
  const x0=tx(from),y0=ty(from),x1=tx(to),y1=ty(to),d=Math.hypot(x1-x0,y1-y0);
  let rivers=0,prev=false;for(let k=0;k<=d;k++){const p=d?k/d:0,i=idx(Math.round(x0+(x1-x0)*p),Math.round(y0+(y1-y0)*p));const r=TER[i]===RIVER||TER[i]===WATER;if(r&&!prev)rivers++;prev=r}
  return Math.max(20,(d*spd+rivers*8))*1000;
}

    if(!B[b].on.includes(TER[i]))throw new Error(B[b].n+" აქ ვერ აშენდება");pay(c,buildCost(c,b));c.tiles[i]=b;if(b!=="wall")pushLog(c,B[b].n+" აშენდა")});
}

async function claim(i){

}
async function trainUnits(u,n){

    if(s.army+s.queued+d.pop*n>s.pop)throw new Error("ადგილი არ არის. ააშენე სახლები");pay(c,d.cost,n);
    const last=Math.max(Date.now(),...(c.queue||[]).map(q=>q.done));c.queue=[...(c.queue||[]),{u,n,done:last+d.time*n*1000}]});
}

  await mutateMe(c=>{pay(c,{[k]:n});pushLog(c,`გაუგზავნე ${n} ${resName(k,c)} → ${o.name}`)});
  await mutate("countries/"+t,cur=>{if(!cur)return;cur.res[k]=(cur.res[k]||0)+n;pushLog(cur,`საჩუქარი (${countries[ME].name}): ${n} ${k==="gold"?"ოქრო":RES[k].n}`);return cur});
  postChat(`🎁 საჩუქარი: ${countries[ME].name} → ${o.name}`,true);
}
async function launchAttack(target,units){
  const o=ownerOf(target);if(!o)throw new Error("სამიზნე არ არის");if(!atWar(ME,o.uid))throw new Error("ამ ქვეყანასთან ომში არ ხარ");
  if(!Object.values(units).some(n=>n>0))throw new Error("აირჩიე ჯარისკაცები");
  const ref=db.collection("attacks").doc();let doc;
  await mutateMe(c=>{for(const u in units){if((c.army[u]||0)<units[u])throw new Error("საკმარისი ჯარი არ გყავს");}for(const u in units)c.army[u]-=units[u];
    const now=Date.now(),tt=travelTime(c.capital,target,units);doc={id:ref.id,from:ME,to:o.uid,units,target,fromTile:c.capital,launch:now,arrive:now+tt,status:"marching"};pushLog(c,"ლაშქრობა დაიწყო: "+o.name)});
  await ref.set(doc);

function battle(a,def){
  const u=a.units,rnd=k=>.9+hash(strHash(a.id),k,SEED)*.2;
  const cav=(u.harcher||0)+(u.knight||0),tot=UK.reduce((s,k)=>s+(u[k]||0),0)||1,f=cav/tot;
  let A=UK.reduce((s,k)=>s+(u[k]||0)*UNITS[k].atk,0)*rnd(1);
  const walls=countNear(def,a.target,"wall",2),towers=countNear(def,a.target,"tower",3),cats=u.catapult||0;
  let bonus=Math.min(1.2,walls*.12)+Math.min(.75,towers*.25)+(def.capital===a.target?.3:0);bonus*=Math.max(0,1-cats*.1);
  const terr={[HILL]:.2,[MOUNTAIN]:.4,[FOREST]:.1}[TER[a.target]]||0;
  let D=(UK.reduce((s,k)=>s+(def.army[k]||0)*UNITS[k].def*(k==="spear"?1+f:1),0)+30+(def.capital===a.target?80:0))*(1+bonus+terr)+towers*25;D*=rnd(2);
  const win=A>D;let atkLoss,defLoss;
  if(win){atkLoss=clamp(.5*Math.pow(D/A,1.3),.03,.9);defLoss=clamp(.6+.3*(A/D-1),.6,1)}else{atkLoss=clamp(.55+.3*(D/Math.max(A,1)-1),.55,1);defLoss=clamp(.5*Math.pow(A/D,1.3),.02,.9)}
  const survivors={};let survivorsN=0,atkLostN=0;for(const k in u){survivors[k]=Math.floor(u[k]*(1-atkLoss));survivorsN+=survivors[k];atkLostN+=u[k]-survivors[k]}
  let defLostN=0;for(const k of UK)defLostN+=(def.army[k]||0)-Math.floor((def.army[k]||0)*(1-defLoss));
  const tiles={};let capital=false;
  if(win){const r=A>2*D?2:1,X=tx(a.target),Y=ty(a.target);
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)+Math.abs(dy)>r)continue;const x=X+dx,y=Y+dy;if(x<0||y<0||x>=W||y>=H)continue;const i=idx(x,y);
      if(!(i in def.tiles))continue;if(i===def.capital&&i!==a.target)continue;tiles[i]=def.tiles[i]}
    capital=a.target===def.capital}
  const lootFrac=win?(capital?.4:.12):0,loot={};for(const k of RK)loot[k]=Math.floor((def.res[k]||0)*lootFrac);
  return {win,A:Math.round(A),D:Math.round(D),atkLoss,defLoss,survivors,survivorsN,atkLostN,defLostN,tiles,tilesN:Object.keys(tiles).length,capital,loot};
}
const busyA=new Set();
async function resolveAttacks(){
  if(!db||!ME)return;const now=Date.now();
  for(const a of Object.values(attacks)){
    if(busyA.has(a.id))continue;
    const involved=a.from===ME||a.to===ME;
    const anyOnline=true; // any player may resolve; locks keep it consistent
    try{
      if(a.status==="marching"&&a.arrive<=now&&(involved||now-a.arrive>15000)){busyA.add(a.id);
        let res=null;
        await mutate("attacks/"+a.id,async cur=>{if(!cur||cur.status!=="marching")return;const ds=await db.doc("countries/"+cur.to).get();
          const def=ds.exists?materialize(JSON.parse(JSON.stringify(ds.data())),Date.now()):{tiles:{},army:{},res:{}};
          if(def.alive===false){def.tiles={};def.army={}}
          res=battle(cur,def);cur.result=res;cur.status="returning";cur.returnAt=cur.arrive+(cur.arrive-cur.launch);return cur});
        if(res){const A=countries[a.from],Dd=countries[a.to];postChat(res.win?`🔥 გამარჯვება: ${A?.name} → ${Dd?.name}, +${res.tilesN} უჯრა${res.capital?". დედაქალაქი დაეცა!":""}`:`🛡 შეტევა მოგერიებულია: ${A?.name} → ${Dd?.name}`,true)}
      }
      if(a.status==="returning"&&a.result){
        const D=countries[a.to];if(D&&!(D.applied||[]).includes(a.id)&&(a.to===ME||a.from===ME||now-a.arrive>15000)){busyA.add(a.id);await applyDefender(a)}
        const A=countries[a.from];if(A&&!(A.applied||[]).includes(a.id)&&(involved||now-a.arrive>15000)){busyA.add(a.id);await applyAttacker(a)}
        if(a.from===ME&&a.returnAt<=now){busyA.add(a.id);await collect(a)}
      }
      if(a.status==="done"&&a.from===ME&&now-a.returnAt>3*3600e3){busyA.add(a.id);await db.doc("attacks/"+a.id).delete()}
    }catch(e){console.warn(e)}finally{busyA.delete(a.id)}
  }
}
async function applyDefender(a){
  const r=a.result;
  await mutate("countries/"+a.to,cur=>{if(!cur||(cur.applied||[]).includes(a.id))return;const c=materialize(cur,Date.now());
    for(const k of UK)c.army[k]=Math.floor((c.army[k]||0)*(1-r.defLoss));
    if(r.win){for(const i in r.tiles)delete c.tiles[i];for(const k of RK)c.res[k]=Math.max(0,c.res[k]-(r.loot[k]||0));
      if(r.capital||!(c.capital in c.tiles)){const keys=Object.keys(c.tiles).map(Number);
        if(!keys.length){c.alive=false;pushLog(c,"შენი ქვეყანა დაეცა")}
        else{const old=c.capital;keys.sort((p,q)=>Math.hypot(tx(p)-tx(old),ty(p)-ty(old))-Math.hypot(tx(q)-tx(old),ty(q)-ty(old)));c.capital=keys[0];c.tiles[keys[0]]="capital";pushLog(c,"დედაქალაქი გადავიდა ახალ ადგილას")}}
      pushLog(c,`დამარცხება (${countries[a.from]?.name||"მტერი"}): -${r.tilesN} უჯრა, -${r.defLostN} ჯარისკაცი`)}
    else pushLog(c,`შეტევა მოიგერიე (${countries[a.from]?.name||"მტერი"}), დანაკარგი ${r.defLostN}`);
    c.applied=[a.id,...(c.applied||[])].slice(0,60);return c});
}
async function applyAttacker(a){
  const r=a.result;

    if(r.win&&c.alive!==false)for(const i in r.tiles)c.tiles[i]=r.tiles[i]==="capital"?"":r.tiles[i];

}

  if(!ruler)throw new Error("ჩაწერე შენი სახელი");if(!name)throw new Error("დაარქვი სახელი ქვეყანას");
  let slot=-1;
  await mutate("meta/slots",async cur=>{cur=cur||{slots:{}};
    for(const k in cur.slots){if(cur.slots[k]===ME){slot=+k;return cur}}
    for(let k=0;k<5;k++){const u=cur.slots[k];if(!u){slot=k;break}const s=await db.doc("countries/"+u).get();if(!s.exists||s.data().alive===false){slot=k;break}}
    if(slot<0)throw new Error("სამყარო სავსეა (5/5)");cur.slots[slot]=ME;return cur});
  const sp=SPAWNS[slot],tiles={};const X=tx(sp),Y=ty(sp);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(Math.abs(dx)+Math.abs(dy)>3)continue;const x=X+dx,y=Y+dy;if(x<0||y<0||x>=W||y>=H)continue;const i=idx(x,y);if(TER[i]===WATER||OWNER[i]>=0)continue;tiles[i]=""}
  tiles[sp]="capital";
  const taken=alive().filter(c=>c.uid!==ME).map(c=>c.color);const color=taken.includes(draft.color)?COLORS.find(c=>!taken.includes(c)):draft.color;
  const doc={uid:ME,ruler,name,currency,color,flag:JSON.parse(JSON.stringify(draft.flag)),slot,capital:sp,created:Date.now(),t:Date.now(),alive:true,
    res:{gold:150,food:100,wood:120,stone:40,iron:0},tiles,army:{},queue:[],wars:[],peace:[],applied:[],log:[{t:Date.now(),m:"ქვეყანა დაარსდა"}]};
  await db.doc("countries/"+ME).set(doc);countries[ME]=doc;rebuildOwners();
  cam.x=X*TS+8;cam.y=Y*TS+8;cam.z=1.8;
  postChat(`👑 დაარსდა ახალი ქვეყანა: ${name} (მმართველი ${ruler})`,true);
}

/* ================= boot ================= */
let isOwnerViewer=false,booted=false,lastPane=0;
function renderAll(force){
  if(!booted)return;
  const has=!!me();$("#side").hidden=!has;
  if(has){renderTabs();renderPane(force);}
  renderHUD();renderTile();
}
function banner(html){const b=document.createElement("div");b.id="banner";b.className="plate";b.innerHTML=html;$("#app").appendChild(b)}
async function boot(){
  resize();drawTerrain();drawTerritory();requestAnimationFrame(frame);
  const cl=window.claude;
  if(cl&&typeof cl.use==="function"){
    const [d,u]=await Promise.all([cl.use("db"),cl.use("user")]);db=d;user=u;
    if(!db||!user){banner(`<h2 style="font-family:var(--display);margin:0 0 8px">შესვლა საჭიროა</h2><p class="muted">სათამაშოდ შედი claude.ai-ზე იმ ანგარიშით, რომელზეც ეს თამაში გაგიზიარეს. მასპინძელმა უნდა მოგიწვიოს რედაქტორად.</p>`);return}
    ME=await user.id();isOwnerViewer=await user.isOwner();
    if(!ME){banner(`<p>შენი ანგარიში ვერ ამოვიცანი. შედი claude.ai-ზე და გახსენი ლინკი ხელახლა.</p>`);return}
    try{const cw=await user.can("data.write");if(cw===false){banner(`<h2 style="font-family:var(--display);margin:0 0 8px">მხოლოდ ყურება</h2><p class="muted">ამ ლინკით მხოლოდ რუკის ნახვა შეგიძლია. სათამაშოდ მასპინძელმა უნდა მოგიწვიოს რედაქტორად.</p>`)}}catch{}
  }else if(FIREBASE_CONFIG&&window.firebase){
    try{const f=await fireDB();db=f.db;ME=f.uid}catch(e){banner(`<h2 style="font-family:var(--display);margin:0 0 8px">სერვერთან კავშირი ვერ დამყარდა</h2><p class="muted">${esc(e.message||e)}</p>`);return}
    isOwnerViewer=location.hash==="#admin";
  }else{
    DEMO=true;db=mockDB();
    try{ME=sessionStorage.getItem("cw_uid")||("demo_"+Math.random().toString(36).slice(2,8));sessionStorage.setItem("cw_uid",ME)}catch{ME="demo_local"}
    isOwnerViewer=true;
  }
  ME=String(ME);
  let gotC=false;const timer=setTimeout(()=>{if(!gotC)toast("სერვერთან კავშირი ნელია…","err")},10000);
  db.collection("countries").onSnapshot(s=>{gotC=true;clearTimeout(timer);const next={};for(const d of s.docs){const v=d.data();if(v)next[d.id]={...v,uid:d.id}}countries=next;rebuildOwners();
    if(!booted){booted=true;const c=me();if(c){cam.x=tx(c.capital)*TS+8;cam.y=ty(c.capital)*TS+8;cam.z=1.8}else showOnboarding()}
    else if(!me()&&!$("#onb")&&countries[ME]?.alive===false){toast("შენი ქვეყანა დაეცა. შეგიძლია ახალი დააარსო.","err");showOnboarding()}
    renderAll()},e=>toast("მონაცემები ვერ ჩაიტვირთა: "+e.code,"err"));
  db.collection("attacks").onSnapshot(s=>{const next={};for(const d of s.docs){const v=d.data();if(v)next[d.id]={...v,id:d.id}}
    for(const id in next){const a=next[id];if(a.to===ME&&a.status==="marching"&&!attacks[id]&&booted)toast(`⚠ ${countries[a.from]?.name||"მტერი"} გიტევს!`,"err")}
    attacks=next;renderAll()},()=>{});
  db.doc("chat/main").onSnapshot(s=>{chat=s.exists?(s.data().msgs||[]):[];if(tab==="chat"){renderPane(false)}else renderTabs()},()=>{});
  setInterval(()=>{renderHUD();if(Date.now()-lastPane>4000){lastPane=Date.now();renderPane(false);renderTile()}},1000);
  setInterval(resolveAttacks,2500);
  if(DEMO)toast("სერვერი ჯერ არ არის ჩართული: თამაში მხოლოდ ამ ბრაუზერში ინახება","err");
}
boot();
</script>
